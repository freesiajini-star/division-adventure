.wrap{
  max-width:1120px;margin:92px auto 28px;padding:24px 28px 28px;
  background:rgba(255,248,230,.94);
  border:4px solid rgba(177,119,55,.55);
  border-radius:28px;
  box-shadow:0 14px 38px rgba(54,67,79,.28),inset 0 0 0 2px rgba(255,255,255,.65);
  position:relative;
}
.wrap:before{
  content:"";position:absolute;inset:8px;border:2px dashed rgba(183,129,70,.28);
  border-radius:20px;pointer-events:none;
}
.top{display:flex;justify-content:flex-end;align-items:center;margin-bottom:12px;position:relative;z-index:2}
h1{display:block;margin:0;font-size:28px;font-weight:900;color:#70401f}
.problem{
  background:linear-gradient(180deg,rgba(232,246,255,.96),rgba(214,238,255,.96));
  border:3px solid #7da9c7;border-radius:18px;padding:10px 13px;
  text-align:center;font-size:29px;font-weight:900;margin-bottom:14px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.75),0 4px 10px rgba(61,96,116,.12);
}
.board{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{
  background:rgba(255,255,255,.86);border-radius:20px;padding:18px;
  border:2px solid rgba(190,153,105,.38);
  box-shadow:0 5px 14px rgba(86,73,51,.12);
}
h2{text-align:center;margin:0 0 14px;font-size:20px}

/* 세로셈은 '보이는 정사각형 격자' 자체를 기준으로 배치한다.
   숫자/계산 단계는 모두 이 격자의 행·열을 사용한다. */
.long{
 width:240px;
 margin:0 auto;
 display:grid;
 grid-template-columns:repeat(5,48px);
 grid-template-rows:repeat(11,48px);
 font-family:monospace;
 font-size:32px;
 font-weight:900;
 position:relative;
 background-color:#fff;
 background-image:
   linear-gradient(to right,#d9dde3 1px,transparent 1px),
   linear-gradient(to bottom,#d9dde3 1px,transparent 1px);
 background-size:48px 48px;
 border:1px solid #cfd4db;
}
.qrow{grid-column:3/6;grid-row:1;display:contents}
.q{grid-row:1;height:44px;margin:2px;border:3px dashed #9ea6b2;border-radius:4px;text-align:center;line-height:38px;background:rgba(255,255,255,.86);cursor:pointer;z-index:4}
.q:nth-child(1){grid-column:3}.q:nth-child(2){grid-column:4}.q:nth-child(3){grid-column:5}
.q.active{border-color:#6678e9;background:#eef0ff}
.divisor{grid-column:1;grid-row:2;text-align:right;padding-right:5px;line-height:48px;z-index:4}
.bracket{grid-column:2;grid-row:2;font-family:Arial,sans-serif;font-size:58px;font-weight:400;line-height:48px;text-align:center;z-index:4}
.quotient-line{grid-column:3/6;grid-row:2;border-top:3px solid #27324a;align-self:start;z-index:6;pointer-events:none}
.num{grid-column:3/6;grid-row:2;display:contents;z-index:3}
.num span{grid-row:2;text-align:center;line-height:48px;z-index:3}
.num span:nth-child(1){grid-column:3}.num span:nth-child(2){grid-column:4}.num span:nth-child(3){grid-column:5}
.calcArea{grid-column:3/6;grid-row:3/14;display:contents}
.calc-cell{text-align:center;line-height:48px;z-index:3}
.calc-line{grid-column:3/6;border-bottom:3px solid #27324a;z-index:5;align-self:end}
.prompt{text-align:center;font-weight:900;min-height:46px;margin:12px 0 6px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:370px;margin:auto}
button{min-height:48px;border:1px solid #d7deea;border-radius:13px;background:#fff;font-size:19px;font-weight:900;color:#27324a}
button:active{transform:scale(.97)}
.feedback{text-align:center;min-height:40px;margin-top:8px}.good{color:#28794a}.bad{color:#b24b4b}
.model{background:rgba(250,251,254,.78);border-radius:16px;padding:13px;min-height:430px}
.model-title{text-align:center;font-weight:900;color:#66738a;margin-bottom:10px}
.groups{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.group{min-height:210px;border:2px dashed #d0d8e5;border-radius:12px;padding:6px;text-align:center}
.group small{color:#7a879a;font-weight:800}.blocks{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:4px;margin-top:8px}
.pool-title{text-align:center;font-size:13px;color:#7a879a;margin:12px 0 5px}
.pool{min-height:80px;border:2px solid #dfe4ec;background:#fff;border-radius:12px;padding:9px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:4px}
.note{text-align:center;color:#66738a;font-size:14px;font-weight:800;margin-top:9px}

/* 디자인 고정: 문제/단계와 무관하게 절대 변경하지 않는다. */
/* 수모형 디자인: 반투명 유광 플라스틱 */
.hundred{
 width:42px;height:42px;border-radius:6px;
 background:
   linear-gradient(145deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.16) 17%,transparent 18%),
   linear-gradient(135deg,#ffad24 0%,#ff8a00 48%,#f26b00 100%);
 border:3px solid rgba(214,91,0,.88);
 box-shadow:
   inset 2px 2px 4px rgba(255,255,255,.85),
   inset -3px -3px 5px rgba(174,63,0,.28),
   0 2px 5px rgba(183,91,0,.22);
 display:block;position:relative;flex:0 0 auto;transform:none;
 overflow:hidden;
}
.hundred:before{
 content:"";position:absolute;left:5px;top:4px;width:22px;height:8px;
 border-radius:50%;background:rgba(255,255,255,.38);
 transform:rotate(-10deg);filter:blur(1px);
}
.hundred:after{
 content:"100";position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;font-size:9px;color:#b84b00;font-weight:900;
 text-shadow:0 1px 1px rgba(255,255,255,.45);
}
.ten{
 width:12px;height:43px;border-radius:4px;
 background:
   linear-gradient(90deg,rgba(255,255,255,.72) 0 17%,transparent 18%),
   linear-gradient(90deg,#70c5ff 0%,#168ef0 48%,#0874d8 100%);
 border:2px solid rgba(39,105,174,.9);
 box-shadow:
   inset 1px 1px 3px rgba(255,255,255,.9),
   inset -2px -2px 4px rgba(25,75,135,.3),
   0 2px 5px rgba(39,105,174,.2);
 display:block;position:relative;flex:0 0 auto;transform:none;
}
.ten:after{
 content:"";position:absolute;top:5px;bottom:5px;left:3px;width:2px;
 background:rgba(235,249,255,.85);box-shadow:2px 0 2px rgba(255,255,255,.25);
}
.one{
 width:22px;height:22px;border-radius:5px;
 background:
   linear-gradient(145deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.15) 22%,transparent 23%),
   linear-gradient(135deg,#a9ed43 0%,#63d51b 52%,#35b80d 100%);
 border:2px solid rgba(62,153,13,.9);
 box-shadow:
   inset 1px 1px 3px rgba(255,255,255,.9),
   inset -2px -2px 4px rgba(35,117,8,.28),
   0 2px 5px rgba(53,150,17,.2);
 display:block;flex:0 0 auto;transform:none;
}

@media(min-width:801px){
  /* PC 화면에서 한 화면에 게임판이 더 잘 들어오도록 전체 크기를 살짝 줄인다. */
  .wrap{zoom:.90}
}

@media(max-width:800px){
  html,body{width:100%;min-width:0;overflow-x:hidden}
  body{background-attachment:scroll;background-position:center top;background-size:auto 100%;-webkit-text-size-adjust:100%}
  .wrap{width:calc(100% - 16px);max-width:none;margin:14px 8px 18px;padding:14px 10px 18px;border-width:3px;border-radius:22px}
  .top{justify-content:center;margin-bottom:10px}
  h1{font-size:24px;line-height:1.2}
  .custom-problem{gap:6px;padding:9px 8px;margin:8px auto 10px}
  .custom-problem input{width:145px;font-size:18px}
  .custom-problem button{padding:7px 11px;font-size:15px}
  .problem{font-size:25px;padding:9px 8px}
  .board{grid-template-columns:minmax(0,1fr);gap:12px}
  .card{min-width:0;padding:12px 8px;border-radius:16px}
  .long{width:240px;max-width:100%;overflow:visible}
  .keys{width:100%;max-width:370px;gap:6px}
  button{min-height:46px;font-size:18px}
  .model{min-height:0;padding:10px}
  .groups{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .group{min-height:170px;padding:5px}
  .pool{min-height:65px}
}
@media(max-width:390px){
  .wrap{width:calc(100% - 10px);margin-left:5px;margin-right:5px;padding-left:7px;padding-right:7px}
  h1{font-size:22px}
  .custom-problem label{width:100%;text-align:center}
  .custom-problem input{width:135px}
  .custom-problem button{padding-left:9px;padding-right:9px}
  .long{transform:scale(.94);transform-origin:top center;margin-bottom:-20px}
}
</style>
<style id="next-problem-style">
.next-problem-btn{
  display:none;margin:14px auto 0;padding:12px 24px;border:2px solid #e0aa60;border-radius:13px;
  background:linear-gradient(180deg,#a86b32,#70401f);color:#fff7dd;font-size:17px;font-weight:900;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 8px rgba(63,45,27,.22);
}
.next-problem-btn:hover{filter:brightness(1.03)}
</style>

<style id="custom-problem-style">
.custom-problem{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px auto 12px;padding:10px 14px;background:rgba(255,255,255,.9);border:2px solid rgba(177,119,55,.4);border-radius:14px;position:relative;z-index:3}
.custom-problem label{font-weight:900;color:#70401f}
.custom-problem input{width:150px;min-height:44px;padding:7px 10px;border:2px solid #cdb38f;border-radius:10px;background:#fff;font-size:20px;font-weight:900;text-align:center}
.custom-problem button{min-height:44px;padding:7px 16px;border:2px solid #e0aa60;border-radius:10px;background:linear-gradient(180deg,#a86b32,#70401f);color:#fff7dd;font-weight:900;cursor:pointer}
.custom-problem .custom-msg{width:100%;text-align:center;font-size:13px;font-weight:800;color:#b24b4b;min-height:18px}
</style>
</head>
<body>

<button id="nextProblem" class="next-problem-btn" onclick="nextProblem()" style="display:none">다음 문제</button>
<div class="wrap">
<div class="top"><h1>나눗셈 탐험대</h1></div>
<div class="custom-problem">
<label for="customExpression">식 입력</label>
<input id="customExpression" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: 835 ÷ 8" aria-label="나눗셈 식">
<button type="button" id="loadCustomProblem">이 식으로 보기</button>
<div class="custom-msg" id="customProblemMsg" aria-live="polite"></div>
</div>
<div class="problem" id="problem"></div>
<div class="board">
<section class="card">
<h2>세로셈</h2>
<div class="long" id="longGrid">
 <div class="qrow" id="qrow"></div>
 <div class="quotient-line"></div>
 <div class="divisor" id="divisor"></div>
 <div class="bracket">)</div>
 <div class="num" id="num"></div>
 <div class="calcArea" id="calcArea"></div>
</div>
<div class="prompt" id="prompt"></div>
<div class="keys" id="keys"></div>
<div class="feedback" id="feedback"></div>
</section>

<section class="card">
<h2>수모형</h2>
<div class="model">
 <div class="model-title">나눈 수와 남은 수가 함께 보여요</div>
 <div class="groups" id="groups"></div>
 <div class="pool-title">아직 나누지 않은 수</div>
 <div class="pool" id="pool"></div>
 <div class="note" id="note"></div>
</div>
</section>
</div>
</div>

<script>
const problems=[
  {n:423,d:4},{n:473,d:7},{n:652,d:6},
  {n:835,d:8},{n:936,d:3},{n:725,d:5}
];

// 2단계는 1단계와 다른 문제 묶음을 사용합니다.
// 같은 세로셈 절차를 연습하되, 1단계 문제를 그대로 반복하지 않습니다.
const stage2Problems=[
  {n:581,d:4},{n:764,d:5},{n:902,d:7},{n:681,d:3},
  {n:547,d:6},{n:812,d:7},{n:394,d:8},{n:926,d:4},
  {n:751,d:9},{n:638,d:5},{n:845,d:7},{n:709,d:6}
];

let activeProblems=problems;
let customProblem=null;
let pi=0,state;

// 게임 진행 포인트: 기존 세로셈 점수와 분리하여, 문제를 완전히 해결할 때만 +10P
let gamePoints=0;
let solvedProblems=0;
let gameStage=1;
let stageProblemCount=0;
let currentProblemPoints=10;
const POINTS_PER_PROBLEM=10;
const STAGE1_PROBLEMS=problems.length;

function updateGameHud(){
  const p=document.getElementById('gamePoints');
  const prog=document.getElementById('gameProgress');
  const cnt=document.getElementById('gameCount');
  const title=document.querySelector('.game-hud .hud-title');
  if(p) p.textContent=gamePoints;
  if(prog){
    const pct = gameStage===1
      ? (stageProblemCount/STAGE1_PROBLEMS)*100
      : Math.min((stageProblemCount/STAGE1_PROBLEMS)*100,100);
    prog.style.width=pct+'%';
  }
  if(cnt) cnt.textContent=gameStage+'단계 · '+(stageProblemCount+1)+'번째 문제';
  if(title) title.textContent=customProblem ? '식 보기' : (gameStage===1 ? '1단계 탐험' : '2단계 탐험');
  const cp=document.getElementById('currentProblemPoints');
  if(cp) cp.textContent='(이번 문제 '+currentProblemPoints+'P)';
}

function addGamePoint(){
  gamePoints += currentProblemPoints;
  solvedProblems += 1;
  stageProblemCount += 1;

  if(gameStage===1 && stageProblemCount>=STAGE1_PROBLEMS){
    gameStage=2;
    stageProblemCount=0;
    activeProblems=stage2Problems;
    pi=0;
  }
  currentProblemPoints=POINTS_PER_PROBLEM;
  updateGameHud();
}

function applyWrongAnswerPenalty(){
  if(gameStage===2 && currentProblemPoints>0){
    currentProblemPoints -= 1;
  }
}
const $=id=>document.getElementById(id);
const block=cls=>{const e=document.createElement('i');e.className=cls;return e};
const put=(el,cls,n)=>{for(let i=0;i<Math.max(0,n);i++)el.appendChild(block(cls))};

function init(){
  updateGameHud();
 const q=customProblem || activeProblems[pi],digits=String(q.n).split('').map(Number);
 state={n:q.n,d:q.d,digits,col:0,partial:digits[0],quotient:[null,null,null],product:null,remainder:null,stage:'select',rows:[],finalRem:null,complete:false};
 render();
}



function parseCustomExpression(raw){
  const cleaned=String(raw).replace(/\s+/g,'');
  const m=cleaned.match(/^(\d{3})(?:÷|\/)(\d)$/);
  if(!m)return null;
  return {n:Number(m[1]),d:Number(m[2])};
}
function loadCustomProblem(){
  const input=document.getElementById('customExpression');
  const msg=document.getElementById('customProblemMsg');
  const parsed=parseCustomExpression(input.value);
  if(!parsed){
    msg.textContent='세 자리 수 ÷ 한 자리 수로 입력해 주세요. 예: 835 ÷ 8';
    return;
  }
  customProblem=parsed;
  pi=0;
  currentProblemPoints=POINTS_PER_PROBLEM;
  const b=document.getElementById('nextProblem');
  if(b)b.style.display='none';
  msg.textContent='';
  init();
}
document.getElementById('loadCustomProblem').addEventListener('click',loadCustomProblem);
document.getElementById('customExpression').addEventListener('keydown',e=>{
  if(e.key==='Enter')loadCustomProblem();
});

function nextProblem(){
  if(customProblem){
    customProblem=null;
    document.getElementById('customExpression').value='';
    document.getElementById('customProblemMsg').textContent='';
  }
  pi=(pi+1)%activeProblems.length;
  const b=document.getElementById('nextProblem');
  if(b) b.style.display='none';
  init();
}

function render(){
 const s=state,q=customProblem || activeProblems[pi];
 $('problem').textContent=`${q.n} ÷ ${q.d}`;
  $('divisor').textContent=q.d;
 $('num').innerHTML=s.digits.map(x=>`<span>${x}</span>`).join('');
 $('qrow').innerHTML=s.quotient.map((v,i)=>`<div class="q ${(s.stage==='select'&&i===s.col)?'active':''}" data-i="${i}">${v==null?'':v}</div>`).join('');
 document.querySelectorAll('.q').forEach(e=>e.onclick=()=>selectQ(+e.dataset.i));
 renderCalc();
 renderPrompt();
 renderKeys();
 renderModel();
}

function selectQ(i){
 if(state.stage!=='select')return;
 if(i!==state.col){bad('지금 내려와 있는 수의 바로 위 빈칸을 눌러 보세요.');return}
 state.stage='quotient';
 good('좋아요. 몫을 골라 보세요.');
 render();
}

function renderPrompt(){
 const m={select:'몫을 쓸 빈칸을 눌러 보세요.',quotient:'몫에 들어갈 숫자를 눌러 보세요.',remainder:'빼고 남은 수를 눌러 보세요.',bring:'다음 숫자를 내려 보세요.',finish:'완성!'};
 $('prompt').textContent=m[state.stage]||'';
}

function renderKeys(){
 const k=$('keys');k.innerHTML='';
 if(state.stage==='quotient'||state.stage==='remainder'){
  for(let n=0;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>input(n);k.appendChild(b)}
 }else if(state.stage==='bring'){
  let b=document.createElement('button');b.textContent='다음 숫자 내려오기';b.style.gridColumn='1/-1';b.onclick=bringNext;k.appendChild(b)
 }
}

/*
  세로셈의 실제 줄을 상태로 관리한다.
  rows에는 계산에서 실제로 보이는 줄만 들어간다.
  calc : 현재 부분수 아래에 곱한 수 / 가로줄 / 나머지
  partial : 다음 숫자를 내려와 만든 부분수. 같은 줄에서 숫자를 이어 붙인다.
  zero : 몫이 0인 열. 별도의 곱셈/뺄셈 줄을 만들지 않는다.
*/
function input(x){
 const s=state,q=customProblem || activeProblems[pi];
 if(s.stage==='quotient'){
  const correct=Math.floor(s.partial/q.d);
  if(x!==correct){applyWrongAnswerPenalty();bad(`${s.partial} ÷ ${q.d}의 몫을 다시 생각해 보세요.`);render();return}
  s.quotient[s.col]=x;
  
  if(x===0){
   s.remainder=s.partial;
   // 0 자체를 계산식으로 한 줄 더 만들지 않는다.
   // 현재 부분수는 그대로 다음 숫자가 붙는 기준이다.
   if(s.col===2){
    s.finalRem=s.partial;s.complete=true;s.stage='finish';addGamePoint();
       const nb=document.getElementById('nextProblem'); if(nb) nb.style.display='block';
    good(`${s.n} ÷ ${s.d}의 계산이 완성되었습니다.`);render();return;
   }
   s.stage='bring';
   good('다음 숫자를 내려 보세요.');
   render();return;
  }

  s.product=x*q.d;
  s.remainder=s.partial-s.product;
  s.stage='remainder';
  good(`${q.d} × ${x} = ${s.product}. 이제 빼고 남은 수를 골라 보세요.`);
  render();return;
 }

 if(s.stage==='remainder'){
  if(x!==s.remainder){applyWrongAnswerPenalty();bad(`${s.partial}에서 ${s.product}을 빼고 남은 수를 골라 보세요.`);render();return}
  // product -> line -> remainder를 정확히 붙인다. 빈 줄을 만들지 않는다.
  s.rows.push({type:'calc',col:s.col,product:s.product,remainder:s.remainder});
    if(s.col===2){
   s.finalRem=x;s.complete=true;s.stage='finish';addGamePoint();
     const nb=document.getElementById('nextProblem'); if(nb) nb.style.display='block';
   good(`${s.n} ÷ ${s.d}의 계산이 완성되었습니다.`);render();return;
  }
  s.stage='bring';
  s.product=null;
  good('다음 숫자를 내려 보세요.');
  render();return;
 }
}

function bringNext(){
 const s=state;
 if(s.stage!=='bring'||s.col>=2)return;

 const next=s.col+1;
 const digit=s.digits[next];
 const previousRemainder=s.remainder;

 let newPartial=previousRemainder*10+digit;

 /*
   화면상의 줄은 새로 만들지 않는다.
   4-4=0 뒤에 2를 내리면 같은 줄에 02가 보인다.
   그 상태에서 몫 0을 거친 뒤 3을 내리면,
   앞의 0은 부분수 계산에서는 의미가 없으므로 23으로 정리한다.
 */
 let display;
 if(previousRemainder===0 && digit!==0){
   display='0'+digit;
 }else{
   display=String(newPartial);
 }

 const last=s.rows[s.rows.length-1];

 if(last && last.type==='partial'){
   // 이미 내려온 숫자가 있는 줄에 다음 숫자를 이어 붙인다.
   // 예: 02 -> 23
   if(last.display.startsWith('0') && last.display.length===2){
     display=last.display.slice(1)+digit;
     newPartial=Number(display);
   }else{
     display=last.display+digit;
     newPartial=Number(display);
   }
   last.display=display;
   last.displayCol=next;
   last.col=next;
 }else{
   s.rows.push({
     type:'partial',
     col:next,
     display,
     displayCol:next,
     value:newPartial
   });
 }

 s.col=next;
 s.partial=newPartial;
 s.remainder=null;
 s.product=null;
 s.stage='select';

 good(`다음 숫자 ${digit}을 내려 보세요.`);
 render();
}
function renderCalc(){
 const area=$('calcArea');
 area.innerHTML='';
 let row=3;

 const addNum=(text,col,r)=>{
  const chars=String(text).split('');
  const start=col-chars.length+1;
  chars.forEach((c,j)=>{
   const pos=start+j;
   if(pos<0||pos>2)return;
   const e=document.createElement('span');
   e.className='calc-cell';
   e.style.gridColumn=String(3+pos);
   e.style.gridRow=String(r);
   e.textContent=c;
   area.appendChild(e);
  });
 };

 const addLine=r=>{
  const e=document.createElement('div');
  e.className='calc-line';
  e.style.gridRow=String(r);
  area.appendChild(e);
 };

 for(const h of state.rows){
  if(h.type==='calc'){
   // 곱한 수를 쓰고, 그 줄 바로 아래에 가로줄을 붙인다.
   addNum(h.product,h.col,row);
   addLine(row);
   row++;
   // 가로줄 바로 아래가 나머지 줄이다.
   addNum(h.remainder,h.col,row);
   row++;
  }else if(h.type==='partial'){
   // 내려온 숫자는 새 줄을 만들지 않는다.
   // 직전 나머지 줄의 오른쪽에 이어 쓴다.
   addNum(h.display,h.displayCol,row-1);
   // 같은 줄을 사용했으므로 row는 그대로 유지한다.
  }
 }

 if(state.stage==='remainder'){
  // 곱한 수와 가로줄까지만 먼저 보여 준다.
  // 나머지는 학생이 정답을 누른 뒤에만 표시한다.
  addNum(state.product,state.col,row);
  addLine(row);
 }
}
function renderModel(){
 const s=state,q=customProblem || activeProblems[pi],groups=$('groups'),pool=$('pool');
 groups.innerHTML='';pool.innerHTML='';
 const boxes=[];
 for(let i=0;i<q.d;i++){
  const g=document.createElement('div');g.className='group';
  g.innerHTML='<small>한 묶음</small><div class="blocks"></div>';
  groups.appendChild(g);boxes.push(g.querySelector('.blocks'));
 }
 let dist=0;
 for(let i=0;i<3;i++){
  const v=s.quotient[i]??0;
  dist+=v*q.d*Math.pow(10,2-i);
  if(v>0){
   const cls=i===0?'hundred':i===1?'ten':'one';
   boxes.forEach(b=>put(b,cls,v));
  }
 }
 let rem=Math.max(0,q.n-dist);
 const h=Math.floor(rem/100);rem%=100;
 const t=Math.floor(rem/10),o=rem%10;
 put(pool,'hundred',h);put(pool,'ten',t);put(pool,'one',o);
 $('note').textContent=s.stage==='finish'?`나머지는 ${s.finalRem}입니다.`:`현재 나눌 수 ${s.partial}을 보고 있어요.`;
}
function good(t){$('feedback').textContent=t;$('feedback').className='feedback good'}
function bad(t){$('feedback').textContent=t;$('feedback').className='feedback bad'}
init();
</script>
</body>
</html>
